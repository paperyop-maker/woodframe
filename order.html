<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디멤버 액자 주문</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f4f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 24px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.08);
  }

  .home-link {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; font-weight: 600; color: #888;
    text-decoration: none; margin-bottom: 16px;
    transition: color 0.15s;
  }
  .home-link:hover { color: #4f46e5; }
  .home-link svg { width: 14px; height: 14px; }

  h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #999; margin-bottom: 32px; }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: #aaa; margin-bottom: 12px;
  }

  /* ── 두께 입력 ── */
  .depth-row {
    display: flex; align-items: center; gap: 18px; margin-bottom: 24px;
  }
  .depth-wrap { width: 120px; flex-shrink: 0; }
  .depth-note {
    font-size: 12px; color: #777; line-height: 1.6;
  }

  /* ── 캔버스 치수 입력 ── */
