<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박스 치수 계산기</title>
<title>디멤버 우드프레임</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e2e4e9; --text:#1c1e21;
    --muted:#6b7280; --accent:#2563eb; --accent-soft:#eaf0fe;
    --danger:#dc2626; --mono:#374151;
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@500;700&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    line-height: 1.6;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  a { color: inherit; }

  /* ── 공통 ── */
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #c9a96e; margin-bottom: 10px;
  }
  .label-bar {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; color: #e8d9b8; margin-bottom: 28px;
  }
  .label-bar::before {
    content: ''; width: 28px; height: 3px; background: #c9a96e; display: inline-block;
  }

  .btn-order {
    display: inline-flex; align-items: center; gap: 8px;
    background: #c9a96e; color: #1a1207;
    font-size: 16px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 16px 30px; border-radius: 100px;
    text-decoration: none; letter-spacing: 0.01em;
    box-shadow: 0 8px 24px rgba(201,169,110,0.35);
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --panel:#1d2027; --border:#2b2f3a; --text:#e8e9ec;
      --muted:#9aa0ac; --accent:#5b8dfc; --accent-soft:#1e2a44;
